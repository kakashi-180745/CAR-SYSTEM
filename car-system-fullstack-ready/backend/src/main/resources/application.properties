# ==========================================
# CAR E-COMMERCE BACKEND CONFIGURATION
# ==========================================

# ------------------------------------------
# SERVER
# ------------------------------------------
server.port=${SERVER_PORT:8080}


# ------------------------------------------
# MYSQL DATABASE
# ------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_ecommerce}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------
# "validate" prevents Hibernate from silently
# changing your database structure.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false


# ------------------------------------------
# JWT AUTHENTICATION
# ------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ------------------------------------------
# CORS
# ------------------------------------------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# ------------------------------------------
# ADMIN
# ------------------------------------------
# Leave empty unless you specifically use the
# protected admin-signup/bootstrap mechanism.
app.admin.signup-code=${ADMIN_SIGNUP_CODE:}

app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:System Admin}


# ------------------------------------------
# FILE UPLOAD
# ------------------------------------------
app.upload-dir=${UPLOAD_DIR:uploads/profiles}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ------------------------------------------
# SECURITY / LOGGING
# ------------------------------------------
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}


# ------------------------------------------
# ADDITIONAL SECURITY
# ------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false