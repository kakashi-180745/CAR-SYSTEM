# ==========================================
# CAR E-COMMERCE BACKEND CONFIGURATION
# ==========================================

# ------------------------------------------
# SERVER
# ------------------------------------------
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}


# ------------------------------------------
# MYSQL DATABASE
# ------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------
# Set JPA_DDL_AUTO=validate in production with Flyway/SQL migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false


# ------------------------------------------
# JWT AUTHENTICATION
# ------------------------------------------
# Override JWT_SECRET in production with a strong random 256-bit+ secret.
app.jwt.secret=${JWT_SECRET:car-system-dev-only-jwt-secret-change-in-production-2026-hmac256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ------------------------------------------
# CORS
# ------------------------------------------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,https://*.e2b.app}


# ------------------------------------------
# ADMIN
# ------------------------------------------
# Configure BOOTSTRAP_ADMIN_EMAIL + BOOTSTRAP_ADMIN_PASSWORD for initial admin,
# or ADMIN_SIGNUP_CODE to enable the /admin/signup registration screen.
app.admin.signup-code=${ADMIN_SIGNUP_CODE:}

app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:System Admin}


# ------------------------------------------
# FILE UPLOAD
# ------------------------------------------
app.upload-dir=${UPLOAD_DIR:uploads/profiles}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ------------------------------------------
# SECURITY / LOGGING
# ------------------------------------------
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}


# ------------------------------------------
# ADDITIONAL SECURITY
# ------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
